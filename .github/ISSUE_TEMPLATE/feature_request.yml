name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the need or friction you have today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: Describe a possible solution. Alternatives are welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Add examples or context that may help.
    validations:
      required: false
